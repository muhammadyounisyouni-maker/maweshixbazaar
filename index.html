.cc span,.cat b{overflow:hidden}
.cc span{width:76px;height:76px}.cat b{width:70px;height:70px}
.row3 .ic{width:64px;height:64px;border-radius:12px;overflow:hidden;font-size:0;flex:none;display:block}
.ci{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-inline-end:4px}
.ph{overflow:hidden}
.sbox{position:relative;flex:1;display:flex;align-items:center}
.sbox input{padding-inline:18px 46px;height:48px;border-radius:99px;background:#fff;color:#202820;border:2px solid transparent;transition:box-shadow .2s,border-color .2s}
.sbox input:focus{border-color:var(--gold);box-shadow:0 0 0 4px #f2b70533;outline:none}
.sbox input::-webkit-search-cancel-button{display:none}
.sx{position:absolute;inset-inline-end:8px;width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;background:#e8ece6;color:#333;display:none;font-size:14px;box-shadow:none}.sbox.has .sx{display:inline-flex}
.sug{position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;box-shadow:0 16px 40px #0006;overflow:hidden auto;display:none;z-index:30;max-height:60vh}.sbox.open .sug{display:block}
.sg{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;min-height:50px}.sg:hover,.sg.on{background:color-mix(in srgb,var(--g) 14%,var(--card))}
.sg img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}.sg .ic2{width:34px;text-align:center;font-size:18px;flex:none}
.sg small{margin-inline-start:auto;color:var(--g);font-weight:700}.sg mark{background:#F2B70566;color:inherit;border-radius:3px}
#mic.rec{background:#c62828;color:#fff;border-color:#c62828;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px #c6282844}}
.hd .srch button svg{width:22px;height:22px;display:block;margin:auto}
.hd .srch>button{min-width:48px;height:48px;padding:0}

.land.bgimg .btn{text-shadow:none}
.wm{font-family:"Playfair Display",Georgia,serif;font-size:clamp(40px,9vw,92px);line-height:1.15;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:1px;margin:10px 0 0;text-shadow:0 6px 28px #000e}
.land.bgimg .chip2{background:#06270fd9}
.wm b{color:var(--gold)}html[lang=ur] .wm{line-height:1.7}
.land.bgimg .stats{margin-top:22px}
.land.bgimg{background:var(--lbase)!important;overflow:hidden;padding-top:300px;--lbase:#06270f;--ovm:radial-gradient(ellipse at 50% 38%,#0000 55%,#000a 100%),linear-gradient(180deg,#06270f55 0,#06270f14 130px,#06270fe0 330px,#06270f 410px);--ovd:radial-gradient(ellipse at 50% 30%,#0000 55%,#000a 100%),linear-gradient(180deg,#06270f88 0,#06270f1a 15.5vw,#06270fe6 28vw,#06270f 31.1vw)}
:root[data-theme="light"] .land.bgimg{--lbase:#F8FAF6;--ovm:linear-gradient(180deg,#F8FAF600 0,#F8FAF600 110px,#F8FAF6ea 300px,#F8FAF6 380px);--ovd:linear-gradient(180deg,#F8FAF600 0,#F8FAF600 14vw,#F8FAF6ea 27vw,#F8FAF6 31.1vw);box-shadow:0 18px 40px #164b3322}
.land.bgimg::before{content:"";position:absolute;inset:0;z-index:0;background:var(--hb) center top/auto 410px no-repeat;transform-origin:50% 0;translate:0 var(--py,0px);animation:heroIn 1.6s ease both,kb 28s ease-in-out 1.6s infinite alternate;will-change:transform}
.land.bgimg::after{content:"";position:absolute;inset:0;z-index:1;background:var(--ovm);pointer-events:none}
.land.bgimg>*{position:relative;z-index:2}
@media(min-width:900px){.land.bgimg::before{background-size:100% auto}.land.bgimg::after{background:var(--ovd)}.land.bgimg{padding-top:0}}
@keyframes kb{to{transform:scale(1.07)}}
:root[data-theme="light"] .land.bgimg .lt *{text-shadow:0 1px 12px #fffd}
:root[data-theme="light"] .wm{color:#0b3d1c;text-shadow:0 2px 22px #fff}
:root[data-theme="light"] .wm b{color:#C98A00}
:root[data-theme="light"] .land.bgimg .lt h1{color:#164B33;-webkit-text-fill-color:#164B33}
:root[data-theme="light"] .land .lt p,:root[data-theme="light"] .land .mini{color:#2f4a38;opacity:1}
:root[data-theme="light"] .land.bgimg .chip2{background:#fff;color:#164B33;border-color:#C98A00}
:root[data-theme="light"] .btn.goldo{color:#164B33;border-color:#164B33;background:#ffffffb8}
:root[data-theme="light"] .land .stats .panel{background:#ffffffe0;border:1px solid #dbe5d7;color:#2f4a38;box-shadow:0 8px 24px #164b3314}
:root[data-theme="light"] .land .stats b{color:#164B33}
:root[data-theme="light"] .mq{background:#fff;border-block:1px solid #ecdfae}
:root[data-theme="light"] .mq-in{color:#7a5a00}
:root[data-theme="light"] .cc{background:#fff;color:#164B33;border:1px solid #dbe5d7;box-shadow:0 2px 10px #164b3312}
:root[data-theme="light"] .cc small{color:var(--sub);opacity:1}
:root[data-theme="light"] header.hd{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:3px solid var(--gold);box-shadow:0 6px 20px #164b3314}
:root[data-theme="light"] .hd .logo{color:#164B33}
:root[data-theme="light"] .hd .ghost{background:#eef3ec;color:#164B33;border:1px solid #dbe5d7}
:root[data-theme="light"] .sbox input{border:2px solid #dbe5d7}
:root[data-theme="light"] footer{background:#eef3ec;color:#4a5f50;border-top:3px solid var(--gold)}
:root[data-theme="light"] footer b{color:#164B33!important}
button,.btn{transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s,background-color .28s,color .28s,border-color .28s}
body,header.hd,.panel,.sec,footer,.cc,.mq,.land .stats .panel{transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease}
.js .grid.rv>.card{opacity:0}
.js .grid.rv.in>.card{opacity:1;animation:cardIn .65s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.grid.rv>.card:nth-child(2){--i:1}.grid.rv>.card:nth-child(3){--i:2}.grid.rv>.card:nth-child(4){--i:3}.grid.rv>.card:nth-child(5){--i:4}.grid.rv>.card:nth-child(6){--i:5}.grid.rv>.card:nth-child(7){--i:6}.grid.rv>.card:nth-child(8){--i:7}

.pop3{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;background:radial-gradient(ellipse at 50% 80%,#3fbf74 0,#1d7a43 38%,#0b3d1c 100%)}

.cc{position:relative;transform-style:preserve-3d;padding-top:34px;min-height:158px}
.cc .pp,.cat .pp{position:relative;display:grid;overflow:visible;border-radius:50%;transform-style:preserve-3d;box-shadow:inset 0 -12px 18px #0008,0 16px 26px #0009;isolation:isolate;background:radial-gradient(circle at 35% 28%,#47c47c,#0b3d1c 72%)}
.cc .pp{width:92px;height:92px;margin-top:6px}.cat .pp{width:78px;height:78px}
.cc .pp .pop3,.cat .pp .pop3{background:none;position:absolute;inset:0}
.cc .pp .pop3::before,.cat .pp .pop3::before{display:none}
.cc .pp .pop3::after,.cat .pp .pop3::after{inset:-32% -16% -2%;filter:drop-shadow(0 8px 6px #000c);transform:translateZ(46px)}
.cat{transform-style:preserve-3d;overflow:visible}
.cc,.card,.cat{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.cc.t3,.card.t3,.cat.t3{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px);box-shadow:0 22px 40px #0006}
.cc.t3::after,.card.t3::after,.cat.t3::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),#ffffff38,transparent 55%)}
.cc .pp::before,.cat .pp::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 1px #0006;z-index:3;pointer-events:none}
.cc .pp .pop3,.cat .pp .pop3{z-index:1}
.roles{display:grid;gap:8px}
.plans{display:grid;gap:12px;margin-top:12px}@media(min-width:760px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 3px #0000000f}
.plan.hot{border:2px solid var(--gold)}.plan h3{margin:0}
.pp2{font-size:26px;font-weight:700;color:var(--g)}
.plan ul{list-style:none;padding:0;margin:4px 0 10px;display:grid;gap:6px}
.plan>button{margin-top:auto}.plan button[disabled]{opacity:.7}
.cc .pp,.cat .pp{background:none;box-shadow:none}
.cc .pp::before,.cat .pp::before{display:none}
.pop3::after{-webkit-mask-image:none;mask-image:none}
</style>
